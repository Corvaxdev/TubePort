name: TubePort CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tubeport-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Source and input contracts
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"

      - name: Install runtime dependency
        shell: pwsh
        run: python -m pip install --requirement .\requirements.txt

      - name: Compile source
        shell: pwsh
        run: python -m py_compile .\src\TubePort.pyw

      - name: Test URL-field keyboard and paste contracts
        shell: pwsh
        run: python .\src\TubePort.pyw --url-input-self-test

      - name: Test process-tree cancellation
        shell: pwsh
        run: python .\src\TubePort.pyw --cancellation-self-test

      - name: Test the English UI, save-location, and attempt contracts
        shell: pwsh
        run: python .\src\TubePort.pyw --ui-contract

  bootstrap-build:
    name: Build the Windows bootstrap archive
    runs-on: windows-latest
    timeout-minutes: 20
    needs: source-contract

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"

      - name: Build and verify package
        shell: pwsh
        run: >-
          .\packaging\build.ps1
          -WorkDirectory "$env:RUNNER_TEMP\TubePort-work"
          -OutputDirectory "$env:RUNNER_TEMP\TubePort-output"
